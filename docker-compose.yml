services:
  microsoft-harness:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: microsoft-copilot-harness
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - FOUNDRY_REGION=westus
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "http.get('http://localhost:3000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 10s
      timeout: 5s
      retries: 3
